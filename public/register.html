<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta — SafeSignal</title>
  <link rel="stylesheet" href="assets/styles/app.css" />
  <link rel="stylesheet" href="assets/styles/register.css" />
</head>
<body>
  <div class="auth-page">
    <nav class="top-nav">
      <a href="index.html" class="brand-logo brand-logo--icon">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="none"><path d="M10 1.5L3 4.5V9C3 13.5 6 17 10 18.3C14 17 17 13.5 17 9V4.5L10 1.5Z" fill="#1A3A5C"/><path d="M6.5 9.8L8.8 12L13.5 7" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="brand-logo__name">SafeSignal</span>
      </a>
      <div class="top-nav__actions">
        <a href="sos.html" class="btn-sos"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1L2 3.5V7C2 10 4.3 12.7 7 13.5C9.7 12.7 12 10 12 7V3.5L7 1Z" fill="white"/></svg>SOS</a>
      </div>
    </nav>
    <div class="auth-body auth-body--wide">
      <div class="auth-card auth-card--wide">
        <h1 class="auth-card__title" id="registerTitle">Crear cuenta</h1>
        <p class="auth-card__sub" id="registerSub">Únete a la red de seguridad ciudadana más confiable de Lima.</p>

        <div class="role-toggle">
          <button type="button" class="role-toggle__btn active" data-role="cliente"><strong>Cliente</strong><span>Ciudadano</span></button>
          <button type="button" class="role-toggle__btn" data-role="admin"><strong>Administrador</strong><span>Central de Monitoreo</span></button>
        </div>

        <div class="form-group"><label class="form-label">Nombres y Apellidos</label><input class="form-input" type="text" id="nombres" placeholder="Ej. Juan Pérez Ramos" /></div>
        <div class="form-group"><label class="form-label" id="emailLabel">Correo electrónico institucional o personal</label><input class="form-input" type="email" id="email" placeholder="usuario@ejemplo.com" /></div>

        <div class="form-row-2">
          <div class="form-group"><label class="form-label" id="idLabel">DNI</label><input class="form-input" type="text" id="docId" placeholder="Ej. 74581290" /></div>
          <div class="form-group"><label class="form-label" id="phoneLabel">Teléfono móvil</label><input class="form-input" type="tel" id="telefono" placeholder="Ej. 987 654 321" /></div>
        </div>

        <div class="form-group">
          <label class="form-label" id="entityLabel">Distrito de residencia</label>
          <div class="form-group-icon">
            <svg class="form-icon" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1C4.8 1 3 2.8 3 5C3 8 7 13 7 13C7 13 11 8 11 5C11 2.8 9.2 1 7 1Z" stroke="#94a3b8" stroke-width="1.4"/></svg>
            <select class="form-input form-input--icon" id="distrito">
              <option value="">Selecciona tu distrito (Lima)</option>
              <option>Miraflores</option><option>San Isidro</option><option>Barranco</option><option>Surco</option><option>San Borja</option><option>La Molina</option><option>Jesús María</option><option>Lince</option><option>Magdalena</option><option>Pueblo Libre</option><option>Cercado de Lima</option><option>Callao</option><option>Los Olivos</option><option>San Martín de Porres</option><option>Otro</option>
            </select>
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label">Contraseña</label>
            <div class="form-group-icon">
              <input class="form-input form-input--icon-r" type="password" id="pass" placeholder="Mínimo 8 caracteres" />
              <button type="button" class="form-eye-btn" data-target="pass" aria-label="Mostrar contraseña">
                <svg class="eye-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1 8C1 8 3.5 3 8 3C12.5 3 15 8 15 8C15 8 12.5 13 8 13C3.5 13 1 8 1 8Z" stroke="#94a3b8" stroke-width="1.3"/><circle cx="8" cy="8" r="2.2" stroke="#94a3b8" stroke-width="1.3"/><line class="eye-slash" x1="2" y1="14" x2="14" y2="2" stroke="#94a3b8" stroke-width="1.3" style="display:none"/></svg>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Confirmar contraseña</label>
            <div class="form-group-icon">
              <input class="form-input form-input--icon-r" type="password" id="passConf" placeholder="Mínimo 8 caracteres" />
              <button type="button" class="form-eye-btn" data-target="passConf" aria-label="Mostrar contraseña">
                <svg class="eye-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1 8C1 8 3.5 3 8 3C12.5 3 15 8 15 8C15 8 12.5 13 8 13C3.5 13 1 8 1 8Z" stroke="#94a3b8" stroke-width="1.3"/><circle cx="8" cy="8" r="2.2" stroke="#94a3b8" stroke-width="1.3"/><line class="eye-slash" x1="2" y1="14" x2="14" y2="2" stroke="#94a3b8" stroke-width="1.3" style="display:none"/></svg>
              </button>
            </div>
          </div>
        </div>

        <p class="form-error" id="registerError" style="display:none;">Revisa los campos: hay información obligatoria incompleta o las contraseñas no coinciden.</p>
        <button class="btn-primary auth-submit" id="btnRegister">Crear cuenta</button>
        <div class="auth-card__footer">¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a></div>
        <div class="auth-security"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="auth-security__icon"><path d="M8 1L2 4V8C2 11.3 4.6 14.4 8 15.3C11.4 14.4 14 11.3 14 8V4L8 1Z" fill="#94a3b8"/></svg>Tus datos están encriptados bajo protocolos AES-256.</div>
      </div>
    </div>
  </div>
  <script src="assets/scripts/register.js"></script>
</body>
</html>
