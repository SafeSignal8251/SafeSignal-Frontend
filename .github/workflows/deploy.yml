name: Deploy public to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar sitio
        run: |
          INDEX=$(find . -name index.html -not -path "./.git/*" | head -n 1)
          DIR=$(dirname "$INDEX")
          echo "Publicando carpeta: $DIR"
          mkdir -p _site
          cp -r "$DIR"/. _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
